name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: dotnet build MkMermaid.slnx -c Release -warnaserror -p:VersionPrefix=${{ steps.version.outputs.value }}
      - run: dotnet test tests/MkMermaid.Tests -c Release --no-build
      - run: dotnet pack src/MkMermaid -c Release --no-build -o artifacts -p:VersionPrefix=${{ steps.version.outputs.value }}
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --title "MkMermaid $GITHUB_REF_NAME" --generate-notes --latest
      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        if: env.NUGET_API_KEY != ''
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
